name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Refreshes the Spotify listening data and the coffee map once a day.
  schedule:
    - cron: "0 5 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

# Never cancel a running deploy; a newer run simply waits its turn.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The coffee script only uses the standard library: no pip install needed.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      # Skipped gracefully when the secrets are absent (e.g. on forks): the
      # committed snapshot in src/data/spotify.json is used instead.
      - name: Refresh Spotify data
        timeout-minutes: 5
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: npm run spotify:sync

      # Non-fatal. The script exits non-zero without touching coffee.json if the
      # KML is unreachable or too many lookups fail, so the build always falls
      # back to the last good committed snapshot.
      - name: Refresh coffee map data
        id: coffee
        timeout-minutes: 10
        continue-on-error: true
        env:
          NOMINATIM_CONTACT: ${{ vars.NOMINATIM_CONTACT || 'lucaspereira0497@gmail.com' }}
        run: npm run coffee:sync

      - name: Warn if coffee sync failed
        if: steps.coffee.outcome == 'failure'
        run: echo "::warning title=Coffee sync failed::Using the committed src/data/coffee.json snapshot."

      # Persist refreshed snapshots so the next run's cache is warm.
      # No-op when nothing changed. Pushes made with GITHUB_TOKEN do not
      # retrigger workflows, so there is no loop.
      - name: Commit refreshed data
        if: github.event_name != 'push'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh spotify & coffee data"
          file_pattern: src/data/coffee.json src/data/spotify.json

      - name: Build
        run: npm run build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
