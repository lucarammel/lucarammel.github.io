name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Refreshes the Spotify listening data and the coffee map once a day without a code change.
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      # Skipped gracefully when the secrets are absent (e.g. on forks): the
      # committed snapshot in src/data/spotify.json is used instead.
      - name: Refresh Spotify data
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: npm run spotify:sync

      # Pulls the public Google My Maps list. Non-fatal: a Maps/Nominatim
      # hiccup falls back to the committed snapshot in src/data/coffee.json
      # rather than blocking the deploy.
      - name: Refresh coffee map data
        continue-on-error: true
        run: npm run coffee:sync

      - name: Build
        run: npm run build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
